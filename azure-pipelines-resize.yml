# Jira -> Azure DevOps -> Terraform -> VMware
# This is the EXISTING resize pipeline entry point (not azure-pipelines.yml,
# which may already be used for VM provisioning).
# Stage 1 validates the request and publishes an exact plan.
# Stage 2 requires the VMware-Resize-Approval environment's approval,
# applies that plan, and marks Jira Resolved only on successful apply.
trigger: none
pr: none

parameters:
- name: jira_issue_key
  displayName: Jira Issue Key
  type: string
  default: ''
- name: vm_name
  displayName: VM Name
  type: string
  default: ''
- name: vm_cpu
  displayName: Requested CPU
  type: number
  default: 2
- name: vm_memory
  displayName: Requested Memory (MB)
  type: number
  default: 2048

pool:
  name: VMware-Lab

variables:
- group: VMware-Terraform-Secrets
- name: terraformDirectory
  value: '$(System.DefaultWorkingDirectory)/jira-vm'

stages:
- stage: ResizePlan
  displayName: Terraform Resize Plan
  condition: |
    and(succeeded(), ne('${{ parameters.vm_name }}', ''))
  jobs:
  - template: pipelines/terraform-plan.yml
    parameters:
      jira_issue_key: ${{ parameters.jira_issue_key }}
      vm_name: ${{ parameters.vm_name }}
      vm_cpu: ${{ parameters.vm_cpu }}
      vm_memory: ${{ parameters.vm_memory }}

- stage: ResizeApply
  displayName: Approve and Apply VM Resize
  dependsOn: ResizePlan
  condition: succeeded()
  jobs:
  - template: pipelines/terraform-apply.yml
    parameters:
      jira_issue_key: ${{ parameters.jira_issue_key }}
      vm_name: ${{ parameters.vm_name }}
      vm_cpu: ${{ parameters.vm_cpu }}
      vm_memory: ${{ parameters.vm_memory }}
