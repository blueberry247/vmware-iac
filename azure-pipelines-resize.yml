# ============================================================
# VMware VM Resize Pipeline
# Jira -> Azure DevOps -> Terraform -> VMware
#
# Version 1:
#   - CPU resize
#   - Memory resize
#
# How this pipeline works:
#   1. Jira sends the VM name and requested CPU/memory values to Azure DevOps.
#   2. Stage 1 opens only that VM's Terraform state and creates a plan.
#   3. The plan is saved as an Azure DevOps artifact.
#   4. The VMware-Resize-Approval environment pauses the pipeline for approval.
#   5. Stage 2 downloads and applies the exact approved plan.
#   6. Only after successful apply: add a Jira comment and move to Done.
#
# Important: this pipeline changes an existing VM. It does not create a new VM.
# ============================================================

# This pipeline is started by Jira or manually. It must not run on every commit.
trigger: none

parameters:

# These values are supplied by Jira's Send web request action.
# The Jira issue key is retained for traceability in logs and future callbacks.

- name: jira_issue_key
  displayName: 'Jira Issue Key'
  type: string
  default: ''

- name: vm_name
  displayName: 'VM Name'
  type: string
  default: ''

- name: vm_cpu
  displayName: 'Requested CPU'
  type: number
  default: 2

- name: vm_memory
  displayName: 'Requested Memory (MB)'
  type: number
  default: 2048


# Use a build agent that can reach vCenter and has Terraform installed.
pool:
  name: VMware-Lab


variables:

# Contains the vSphere credentials and Terraform backend settings.
# Secret values must be marked secret in the Azure DevOps variable group.
- group: VMware-Terraform-Secrets

# Root folder containing the Terraform configuration for the VM.
- name: terraformDirectory
  value: '$(System.DefaultWorkingDirectory)/jira-vm'

# ============================================================
# STAGE 1
# Validate request and create Terraform resize plan
# ============================================================

stages:

- stage: ResizePlan
  displayName: 'Terraform Resize Plan'

  # Do not create a plan when Jira did not provide a VM name.
  condition: |
    and(
      succeeded(),
      ne('${{ parameters.vm_name }}', '')
    )

  jobs:

  - job: TerraformResizePlan
    displayName: 'Validate VM and Create Resize Plan'

    steps:

    - checkout: self

    # Check the Jira integration before Terraform is allowed to change a VM.
    # Jira Cloud REST API v3: this is read-only.
    - bash: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import base64, json, os, re, sys
        from urllib.request import Request, urlopen
        from urllib.error import HTTPError, URLError
        from urllib.parse import quote

        base = os.environ['JIRA_BASE_URL'].rstrip('/')
        issue = os.environ['JIRA_ISSUE_KEY'].strip().upper()
        email = os.environ['JIRA_EMAIL']
        token = os.environ['JIRA_API_TOKEN']
        if not base.startswith('https://') or not email or not token:
            sys.exit('JIRA PREFLIGHT FAILED: Configure JIRA_BASE_URL, JIRA_EMAIL and JIRA_API_TOKEN.')
        if not re.fullmatch(r'[A-Z][A-Z0-9_]*-[0-9]+', issue):
            sys.exit('JIRA PREFLIGHT FAILED: Invalid Jira issue key.')
        basic = base64.b64encode(f'{email}:{token}'.encode()).decode()
        headers = {'Authorization': f'Basic {basic}', 'Accept': 'application/json'}

        def fetch(path):
            try:
                with urlopen(Request(base + path, headers=headers), timeout=25) as r:
                    return json.load(r)
            except HTTPError as e:
                sys.exit(f'JIRA PREFLIGHT FAILED: HTTP {e.code} from Jira. Check API credentials, permissions and issue key.')
            except (URLError, TimeoutError) as e:
                sys.exit(f'JIRA PREFLIGHT FAILED: Jira is not reachable: {e.reason if hasattr(e, "reason") else e}')

        path = '/rest/api/3/issue/' + quote(issue, safe='')
        status = fetch(path + '?fields=status').get('fields', {}).get('status', {}).get('name', '')
        if status.casefold() == 'done':
            sys.exit(f'JIRA PREFLIGHT FAILED: {issue} is already Done; refusing to resize on a completed request.')
        transitions = fetch(path + '/transitions').get('transitions', [])
        done = [t for t in transitions if (t.get('to') or {}).get('name', '').casefold() == 'done']
        if len(done) != 1:
            options = ', '.join((t.get('to') or {}).get('name','?') for t in transitions)
            sys.exit(f'JIRA PREFLIGHT FAILED: Need exactly one accessible transition to Done. Available: {options or "none"}')
        print(f'Jira preflight passed: {issue}, current status {status}, Done transition available.')
        PYCODE
      displayName: 'Verify Jira can be completed'
      env:
        JIRA_BASE_URL: $(JIRA_BASE_URL)
        JIRA_EMAIL: $(JIRA_EMAIL)
        JIRA_API_TOKEN: $(JIRA_API_TOKEN)
        JIRA_ISSUE_KEY: ${{ parameters.jira_issue_key }}

    # AzureCLI logs in to Azure so Terraform can authenticate to the
    # remote Azure Storage state backend using the pipeline identity.
    - task: AzureCLI@2
      displayName: 'Create Terraform Resize Plan'

      inputs:
        azureSubscription: 'Azure-Terraform-State'
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true

        inlineScript: |

          set -euo pipefail

          # ----------------------------------------------------
          # Azure authentication for Terraform backend
          # ----------------------------------------------------

          export ARM_USE_AZUREAD=true
          export ARM_USE_OIDC=true
          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_TENANT_ID="$tenantId"
          export ARM_OIDC_TOKEN="$idToken"

          # Validate Jira parameters before constructing a Terraform state key.
          # Block slashes, dots and other characters that could select a different state.
          if [[ ! "$TF_VAR_vm_name" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$ ]]; then
            echo "ERROR: Invalid VM name supplied by Jira."
            exit 1
          fi

          if [[ ! "$TF_VAR_vm_cpu" =~ ^[0-9]+$ ]] ||
             [[ ! "$TF_VAR_vm_memory" =~ ^[0-9]+$ ]]; then
            echo "ERROR: CPU and memory must be positive whole numbers."
            exit 1
          fi
          if (( TF_VAR_vm_cpu < 1 || TF_VAR_vm_memory < 1 )); then
            echo "ERROR: CPU and memory must be greater than zero."
            exit 1
          fi

          # All Terraform commands below run from the VM Terraform root.
          cd "$(terraformDirectory)"

          echo "===================================="
          echo "VM RESIZE REQUEST"
          echo "===================================="
          # Jira issue is traceability-only; do not fail the shell if the
          # webhook did not provide it.
          echo "Jira Issue:       ${JIRA_ISSUE_KEY:-not-provided}"
          echo "VM Name:          $TF_VAR_vm_name"
          echo "Requested CPU:    $TF_VAR_vm_cpu"
          echo "Requested Memory: $TF_VAR_vm_memory MB"
          echo "===================================="

          # ----------------------------------------------------
          # Connect ONLY to the requested VM's Terraform state.
          # Each VM has a separate state file, so the requested VM name
          # determines which state is opened.
          # ----------------------------------------------------

          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="key=jira-vms/${TF_VAR_vm_name}.tfstate"

          # These variables are required by the Terraform configuration and
          # are retained from the VM's existing state outputs.
          TF_VAR_vm_hostname="$(terraform output -raw vm_hostname)"
          TF_VAR_vm_network="$(terraform output -raw vm_network)"

          if [ -z "$TF_VAR_vm_hostname" ] || [ -z "$TF_VAR_vm_network" ]; then
            echo "ERROR: Existing VM hostname or network is missing."
            exit 1
          fi

          export TF_VAR_vm_hostname
          export TF_VAR_vm_network

          # Detect the operating system from resources present in this VM's
          # state. Do not use `terraform output` here: older VM states may
          # predate the vm_os output even though the VM is valid.
          if terraform state list | grep -Fxq 'data.vsphere_virtual_machine.windows_template[0]'; then
            export TF_VAR_vm_os='Windows Server 2022'
          elif terraform state list | grep -Fxq 'data.vsphere_virtual_machine.template'; then
            export TF_VAR_vm_os='Debian 13'
          else
            echo "ERROR: Unable to establish Windows/Debian template from state."
            exit 1
          fi

          echo "Operating system selected from state: $TF_VAR_vm_os"

          # ----------------------------------------------------
          # SAFETY CHECK 1
          # This resize pipeline only supports module-based VMs.
          # ----------------------------------------------------

          VM_RESOURCE="module.vm.vsphere_virtual_machine.vm"

          if ! terraform state list | grep -Fqx "$VM_RESOURCE"; then
            echo "ERROR: Module-based VM resource not found in Terraform state."
            echo "Resize cancelled."
            exit 1
          fi

          echo ""
          echo "Module-based VM resource found."

          # ----------------------------------------------------
          # SAFETY CHECK 2
          # State VM name must exactly match the Jira request.
          # ----------------------------------------------------

          STATE_VM_NAME=$(terraform state show -no-color \
            "$VM_RESOURCE" |
            sed -n 's/^[[:space:]]*name[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' |
            head -1)

          echo "Requested VM: $TF_VAR_vm_name"
          echo "State VM:     $STATE_VM_NAME"

          if [ -z "$STATE_VM_NAME" ]; then
            echo "ERROR: Could not determine VM name from Terraform state."
            echo "Resize cancelled."
            exit 1
          fi

          if [ "$STATE_VM_NAME" != "$TF_VAR_vm_name" ]; then
            echo "ERROR: Requested VM does not match Terraform state."
            echo "Resize cancelled."
            exit 1
          fi

          # ----------------------------------------------------
          # DATASTORE PRESERVATION: use the LIVE VMware value.
          # A plain `terraform state show` can return a STALE datastore ID
          # after a Storage vMotion/manual move. That is what happened to
          # TF-VM-013: state said datastore-1140, vCenter said datastore-22.
          #
          # A refresh-only PLAN reads the real values from vSphere without
          # modifying either the VM or the remote Terraform state. It is
          # NEVER applied. Only its refreshed VM datastore value is used.
          # ----------------------------------------------------
          echo "Discovering the VM's current datastore from vSphere..."
          rm -f datastore-refresh.tfplan datastore-refresh.json
          trap 'rm -f datastore-refresh.tfplan datastore-refresh.json' EXIT

          terraform plan \
            -refresh-only \
            -input=false \
            -no-color \
            -out=datastore-refresh.tfplan > /dev/null

          # JSON plans can contain sensitive information. Never print them.
          terraform show -json datastore-refresh.tfplan > datastore-refresh.json

          # Read the refreshed datastore from Terraform's refresh-only plan.
          # Resource drift is authoritative when VMware differs from saved state.
          # The plan may omit the VM from planned_values in refresh-only mode.
          TF_VAR_vm_datastore_id="$(python3 - <<'PY'
          import json
          import os
          import re
          import sys

          TARGET = "module.vm.vsphere_virtual_machine.vm"
          expected_name = os.environ["TF_VAR_vm_name"]

          def fail(message):
              sys.exit(f"ERROR: {message}")

          def find_resources(state_values):
              """Find the exact VM in root/child modules of a state-values object."""
              def walk(module):
                  for item in module.get("resources", []):
                      yield item
                  for child in module.get("child_modules", []):
                      yield from walk(child)

              root = (state_values or {}).get("root_module") or {}
              return [r for r in walk(root)
                      if r.get("address") == TARGET and r.get("mode") == "managed"]

          with open("datastore-refresh.json", encoding="utf-8") as handle:
              document = json.load(handle)

          drift = [r for r in document.get("resource_drift", [])
                   if r.get("address") == TARGET and r.get("mode") == "managed"]
          if len(drift) > 1:
              fail("Multiple drift records found for the requested VM")

          if drift:
              change = drift[0].get("change") or {}
              if change.get("actions") not in (["update"], ["no-op"]):
                  fail("VM was deleted or replaced outside Terraform")
              values = change.get("after") or {}
              previous = change.get("before") or {}
              if previous.get("id") and previous.get("id") != values.get("id"):
                  fail("VM identity changed during refresh")
              source = "vSphere refresh (resource_drift)"
          else:
              matches = find_resources(document.get("planned_values"))
              source = "refresh-only planned_values"
              if not matches:
                  # If no drift was detected for this VM, the saved prior-state
                  # datastore is still current. Do not use it if VM drift exists.
                  prior_values = (document.get("prior_state") or {}).get("values")
                  matches = find_resources(prior_values)
                  source = "prior_state (no VM drift)"
              if len(matches) != 1:
                  fail("Cannot uniquely identify the VM in the refreshed Terraform plan")
              values = matches[0].get("values") or {}

          if values.get("name") != expected_name or not values.get("id"):
              fail("Refreshed VM identity does not match Jira request")

          datastore = values.get("datastore_id")
          if not isinstance(datastore, str) or not re.fullmatch(r"datastore-[0-9]+", datastore):
              fail("Refresh did not return a valid datastore ID")

          print(f"Datastore source: {source}", file=sys.stderr)
          print(datastore)
          PY
          )"

          export TF_VAR_vm_datastore_id
          echo "Verified live VM datastore ID: $TF_VAR_vm_datastore_id"
          rm -f datastore-refresh.tfplan datastore-refresh.json

          echo ""
          echo "VM identity verification passed."

          # ----------------------------------------------------
          # Create the resize plan.
          #
          # The existing Terraform module will retain the VM,
          # template, network and disk configuration.
          # Only CPU/RAM values supplied by Jira should change.
          # No changes are applied in this stage.
          # ----------------------------------------------------

          terraform plan \
            -input=false \
            -out=resize.tfplan
          
          # Convert Terraform plan to JSON for safety validation
          terraform show -json resize.tfplan > resize-plan.json


          # ----------------------------------------------------
          # SAFETY CHECK 3
          # Allow CPU and memory changes ONLY.
          # Reject VM replacement, deletion or other changes.
          # ----------------------------------------------------

          python3 - <<'PY'
          import json
          import os
          import sys

          def fail(message):
              print(f"RESIZE BLOCKED: {message}")
              sys.exit(1)

          with open("resize-plan.json", encoding="utf-8") as f:
              plan = json.load(f)

          target = "module.vm.vsphere_virtual_machine.vm"
          allowed = {"num_cpus", "memory"}
          expected_name = os.environ["TF_VAR_vm_name"]
          expected_cpu = int(os.environ["TF_VAR_vm_cpu"])
          expected_memory = int(os.environ["TF_VAR_vm_memory"])
          expected_datastore = os.environ["TF_VAR_vm_datastore_id"]
          updates = 0

          for resource in plan.get("resource_changes", []):
              if resource.get("mode") != "managed":
                  continue

              address = resource.get("address", "<unknown>")
              change = resource.get("change") or {}
              actions = change.get("actions", [])
              if actions == ["no-op"]:
                  continue

              if address != target:
                  fail(f"Unexpected managed resource change: {address}")
              if actions != ["update"]:
                  fail(f"VM must be updated in place, not replaced or deleted: {actions}")

              before = change.get("before") or {}
              after = change.get("after") or {}
              if before.get("name") != expected_name or after.get("name") != expected_name:
                  fail("VM name does not match the Jira request")
              if (before.get("datastore_id") != expected_datastore or
                      after.get("datastore_id") != expected_datastore):
                  fail("Datastore does not match the live vSphere datastore")

              changed = {key for key in set(before) | set(after)
                         if before.get(key) != after.get(key)}
              if not changed:
                  fail("No actual VM setting changes found")
              if changed - allowed:
                  fail(f"Unexpected VM setting changes: {sorted(changed - allowed)}")

              # Unknown computed settings could hide an additional planned change.
              # Fail closed; inspect such plans rather than automatically apply them.
              unknown = change.get("after_unknown") or {}
              for key, value in unknown.items():
                  if key not in allowed and value:
                      fail(f"Non-resize attribute has an unknown planned value: {key}")

              if after.get("num_cpus") != expected_cpu:
                  fail("CPU does not match the Jira request")
              if after.get("memory") != expected_memory:
                  fail("Memory does not match the Jira request")
              updates += 1

          if updates != 1:
              fail(f"Expected exactly one VM update, found {updates}")

          print("SAFETY CHECK PASSED: only permitted CPU/memory changes.")
          print(f"VM: {expected_name}")
          print(f"CPU: {before.get('num_cpus')} -> {after.get('num_cpus')}")
          print(f"Memory (MB): {before.get('memory')} -> {after.get('memory')}")
          PY

          
          # Do not print the full Terraform plan here: it can contain secrets.
          echo "Resize plan validated successfully; awaiting manual approval."

      env:

        # vSphere credentials used by the Terraform vSphere provider.
        # VSPHERE_PASSWORD must be a secret variable.
        TF_VAR_vsphere_user: $(VSPHERE_USER)
        TF_VAR_vsphere_password: $(VSPHERE_PASSWORD)
        TF_VAR_vsphere_server: $(VSPHERE_SERVER)

        TF_VAR_ansible_ssh_public_key: $(ANSIBLE_SSH_PUBLIC_KEY)
        TF_VAR_windows_admin_password: $(WINDOWS_ADMIN_PASSWORD)

        # Existing VM that Jira requested to resize.
        TF_VAR_vm_name: ${{ parameters.vm_name }}

        # New CPU and memory values that Terraform will plan.
        TF_VAR_vm_cpu: ${{ parameters.vm_cpu }}
        TF_VAR_vm_memory: ${{ parameters.vm_memory }}

       

        # Jira
        JIRA_ISSUE_KEY: ${{ parameters.jira_issue_key }}


    # Save the exact plan for the approval/apply stage. Applying this same
    # artifact prevents the approved plan from changing between stages.
    - publish: $(terraformDirectory)/resize.tfplan
      artifact: terraform-resize-plan
      displayName: 'Save Terraform Resize Plan'

    - bash: |
        rm -f "$(terraformDirectory)/resize-plan.json" "$(terraformDirectory)/resize.tfplan"
      displayName: 'Clean up local plan files'
      condition: always()


# ============================================================
# STAGE 2
# Approval gate and apply the exact Terraform resize plan.
# The deployment environment below supplies the manual approval gate.
# ============================================================

- stage: ResizeApply
  displayName: 'Approve and Apply VM Resize'
  dependsOn: ResizePlan
  condition: succeeded()

  jobs:

  - deployment: TerraformResizeApply
    displayName: 'Apply Approved Resize Plan'

    # Configure approvals and checks on this Azure DevOps environment.
    environment: 'VMware-Resize-Approval'

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          # Download the plan created by Stage 1 after approval.
          - download: current
            artifact: terraform-resize-plan
            displayName: 'Download Approved Resize Plan'

          # Use the same Azure authentication method and state key used
          # during planning, then apply only the downloaded plan file.
          - task: AzureCLI@2
            displayName: 'Apply Terraform Resize Plan'

            inputs:
              azureSubscription: 'Azure-Terraform-State'
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true

              inlineScript: |

                set -euo pipefail

                export ARM_USE_AZUREAD=true
                export ARM_USE_OIDC=true
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_OIDC_TOKEN="$idToken"

                cd "$(terraformDirectory)"

                echo "===================================="
                echo "APPROVED VM RESIZE"
                echo "===================================="
                echo "VM Name:          $TF_VAR_vm_name"
                echo "Requested CPU:    $TF_VAR_vm_cpu"
                echo "Requested Memory: $TF_VAR_vm_memory MB"
                echo "===================================="

                # Revalidate VM name before using it in the remote state key.
                if [[ ! "$TF_VAR_vm_name" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$ ]]; then
                  echo "ERROR: Invalid VM name supplied by Jira."
                  exit 1
                fi

                # Re-open the same per-VM Terraform state before applying.
                terraform init \
                  -input=false \
                  -reconfigure \
                  -backend-config="key=jira-vms/${TF_VAR_vm_name}.tfstate"

                # The artifact is downloaded outside the Terraform folder,
                # so copy it into the folder expected by terraform apply.
                cp "$(Pipeline.Workspace)/terraform-resize-plan/resize.tfplan" \
                   "$(terraformDirectory)/resize.tfplan"

                echo ""
                echo "Applying exact approved Terraform plan..."

                # Apply the exact plan that passed the approval gate.
                # Do not run terraform plan again here.
                terraform apply \
                  -input=false \
                  resize.tfplan

                echo ""
                echo "===================================="
                echo "VM RESIZE COMPLETED"
                echo "===================================="
                echo "VM:     $TF_VAR_vm_name"
                echo "CPU:    $TF_VAR_vm_cpu"
                echo "Memory: $TF_VAR_vm_memory MB"
                echo "===================================="

            env:

              # Provider credentials and the same VM/request values used
              # during the planning stage.
              TF_VAR_vsphere_user: $(VSPHERE_USER)
              TF_VAR_vsphere_password: $(VSPHERE_PASSWORD)
              TF_VAR_vsphere_server: $(VSPHERE_SERVER)

              TF_VAR_vm_name: ${{ parameters.vm_name }}
              TF_VAR_vm_cpu: ${{ parameters.vm_cpu }}
              TF_VAR_vm_memory: ${{ parameters.vm_memory }}

            

              JIRA_ISSUE_KEY: ${{ parameters.jira_issue_key }}

          # Only execute after Terraform apply succeeds.
          # Comment on the original Jira ticket, then transition it to Done.
          # Jira's completion failure will fail this job, but does NOT undo
          # a successful Terraform apply; do not rerun a resize to retry Jira.
          - bash: |
              set -euo pipefail
              python3 - <<'PYCODE'
              import base64, json, os, re, sys
              from urllib.request import Request, urlopen
              from urllib.error import HTTPError, URLError
              from urllib.parse import quote

              base = os.environ['JIRA_BASE_URL'].rstrip('/')
              issue = os.environ['JIRA_ISSUE_KEY'].strip().upper()
              email = os.environ['JIRA_EMAIL']
              token = os.environ['JIRA_API_TOKEN']
              vm_name = os.environ['VM_NAME']
              cpu = int(os.environ['REQUESTED_CPU'])
              memory = int(os.environ['REQUESTED_MEMORY'])
              build_id = os.environ['BUILD_ID']

              if not base.startswith('https://') or not email or not token:
                  sys.exit('JIRA SYNC FAILED after successful Terraform apply: missing Jira configuration.')
              if not re.fullmatch(r'[A-Z][A-Z0-9_]*-[0-9]+', issue):
                  sys.exit('JIRA SYNC FAILED: Invalid Jira issue key.')
              basic = base64.b64encode(f'{email}:{token}'.encode()).decode()
              headers = {
                  'Authorization': f'Basic {basic}',
                  'Accept': 'application/json',
                  'Content-Type': 'application/json',
              }

              def api(method, path, payload=None):
                  body = json.dumps(payload).encode('utf-8') if payload is not None else None
                  try:
                      req = Request(base + path, data=body, headers=headers, method=method)
                      with urlopen(req, timeout=30) as response:
                          raw = response.read()
                          return json.loads(raw) if raw else {}
                  except HTTPError as exc:
                      sys.exit(f'JIRA SYNC FAILED (Terraform already applied): HTTP {exc.code}. Check Jira permissions and workflow.')
                  except (URLError, TimeoutError) as exc:
                      sys.exit(f'JIRA SYNC FAILED (Terraform already applied): Jira unreachable: {exc.reason if hasattr(exc, "reason") else exc}')

              path = '/rest/api/3/issue/' + quote(issue, safe='')
              status = api('GET', path + '?fields=status').get('fields', {}).get('status', {}).get('name', '')
              if status.casefold() == 'done':
                  print(f'{issue} is already Done; no duplicate comment or transition created.')
                  sys.exit(0)

              transitions = api('GET', path + '/transitions').get('transitions', [])
              done = [t for t in transitions if (t.get('to') or {}).get('name', '').casefold() == 'done']
              if len(done) != 1:
                  sys.exit('JIRA SYNC FAILED (Terraform already applied): no unique available Done transition.')

              message = (
                  'VM RESIZE COMPLETED SUCCESSFULLY\n'
                  f'Jira ticket: {issue}\n'
                  f'VM: {vm_name}\n'
                  f'CPU: {cpu} vCPU\n'
                  f'Memory: {memory} MB\n'
                  'Terraform: apply succeeded; 0 VMs created/deleted.\n'
                  'Plan safety check: only CPU and memory changes permitted; '
                  'datastore, disks and network not modified in the validated plan.\n'
                  f'Azure DevOps build: {build_id}\n'
                  'Note: power-on and guest health are not verified by this callback.'
              )
              adf = {'type': 'doc', 'version': 1,
                     'content': [{'type': 'paragraph',
                                  'content': [{'type': 'text', 'text': line}]}
                                 for line in message.split('\n')]}
              # Jira Cloud supports posting a comment as part of the same
              # workflow transition. If transition fails, neither should be written.
              api('POST', path + '/transitions', {
                  'transition': {'id': done[0]['id']},
                  'update': {'comment': [{'add': {'body': adf}}]},
              })
              new_status = api('GET', path + '?fields=status').get('fields', {}).get('status', {}).get('name', '')
              if new_status.casefold() != 'done':
                  sys.exit(f'JIRA SYNC FAILED: transition returned but status is {new_status!r}; needs investigation.')
              print(f'Jira {issue}: success comment added and status transitioned to Done.')
              PYCODE
            displayName: 'Add Jira success comment and transition to Done'
            condition: succeeded()
            env:
              JIRA_BASE_URL: $(JIRA_BASE_URL)
              JIRA_EMAIL: $(JIRA_EMAIL)
              JIRA_API_TOKEN: $(JIRA_API_TOKEN)
              JIRA_ISSUE_KEY: ${{ parameters.jira_issue_key }}
              VM_NAME: ${{ parameters.vm_name }}
              REQUESTED_CPU: ${{ parameters.vm_cpu }}
              REQUESTED_MEMORY: ${{ parameters.vm_memory }}
              BUILD_ID: $(Build.BuildId)

          - bash: |
              rm -f "$(terraformDirectory)/resize.tfplan"
            displayName: 'Clean up applied plan file'
            condition: always()















