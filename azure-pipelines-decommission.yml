# ============================================================
# VMware VM Decommission Pipeline
#
# Jira -> Azure DevOps -> Terraform -> VMware
# ============================================================

parameters:

- name: jira_issue_key
  displayName: 'Jira Issue Key'
  type: string
  default: ''

- name: vm_name
  displayName: 'VM Name to Decommission'
  type: string
  default: ''


# Do not run automatically from Git commits
trigger: none


pool:
  name: VMware-Lab


variables:

- group: VMware-Terraform-Secrets

- name: terraformDirectory
  value: '$(System.DefaultWorkingDirectory)/jira-vm'


# ============================================================
# STAGE 1 - DESTROY PLAN
# ============================================================

stages:

- stage: DestroyPlan
  displayName: 'Terraform Destroy Plan'

  condition: |
    and(
      succeeded(),
      ne('${{ parameters.vm_name }}', '')
    )

  jobs:

  - job: TerraformDestroyPlan
    displayName: 'Plan VM Decommission'

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: 'Verify VM State and Create Destroy Plan'

      inputs:
        azureSubscription: 'Azure-Terraform-State'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true

        inlineScript: |

          set -euo pipefail

          # Restrict plan-file permissions and remove plaintext on exit.
          umask 077
          rm -f "$(terraformDirectory)/destroy.tfplan" "$(terraformDirectory)/destroy.tfplan.gpg"
          trap 'rm -f destroy.tfplan' EXIT

          # ----------------------------------------------------
          # Azure authentication for Terraform remote state
          # ----------------------------------------------------

          export ARM_USE_AZUREAD=true
          export ARM_USE_OIDC=true
          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_TENANT_ID="$tenantId"
          export ARM_OIDC_TOKEN="$idToken"

          cd "$(terraformDirectory)"

          echo "===================================="
          echo "VM DECOMMISSION REQUEST"
          echo "===================================="
          echo "Jira Issue: $JIRA_ISSUE_KEY"
          echo "VM Name:    $TF_VAR_vm_name"
          echo "===================================="

          # Prevent malformed VM names being used as state-file paths.
          if [[ ! "$TF_VAR_vm_name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "ERROR: Invalid VM name; destroy cancelled."
            exit 1
          fi

          # ----------------------------------------------------
          # Connect ONLY to this VM's Terraform state
          #
          # Example:
          # jira-vms/TF-VM-014.tfstate
          # ----------------------------------------------------

          terraform init \
            -reconfigure \
            -backend-config="key=jira-vms/${TF_VAR_vm_name}.tfstate"

          echo ""
          echo "Terraform state:"
          terraform state list

          # ----------------------------------------------------
          # SAFETY CHECK 1
          #
          # Support both legacy VM states and VMs provisioned
          # through the reusable Terraform VM module.
          # ----------------------------------------------------

          if terraform state list | grep -qx "module.vm.vsphere_virtual_machine.vm"; then
            VM_RESOURCE="module.vm.vsphere_virtual_machine.vm"
            echo "Module-based VM resource found."

          elif terraform state list | grep -qx "vsphere_virtual_machine.jira_vm"; then
            VM_RESOURCE="vsphere_virtual_machine.jira_vm"
            echo "Legacy VM resource found."

          else
            echo "ERROR: No managed Jira VM found in this Terraform state."
            echo "Destroy cancelled."
            exit 1
          fi

          # ----------------------------------------------------
          # SAFETY CHECK 2
          #
          # VM name stored in Terraform state must match
          # the VM requested through Jira.
          # ----------------------------------------------------

          STATE_VM_NAME=$(terraform state show -no-color \
            "$VM_RESOURCE" |
            sed -n 's/^[[:space:]]*name[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' |
            head -1)

          echo ""
          echo "Requested VM: $TF_VAR_vm_name"
          echo "State VM:     $STATE_VM_NAME"

          # Fail safely if the VM name cannot be read from state
          if [ -z "$STATE_VM_NAME" ]; then
            echo "ERROR: Could not determine VM name from Terraform state."
            echo "Destroy cancelled."
            exit 1
          fi

          # The VM in state must exactly match the VM requested by Jira
          if [ "$STATE_VM_NAME" != "$TF_VAR_vm_name" ]; then
            echo "ERROR: Requested VM does not match Terraform state."
            echo "Destroy cancelled."
            exit 1
          fi

          echo ""
          echo "VM identity verification passed."

          # ----------------------------------------------------
          # Detect the OS from THIS VM's Terraform state.
          # Windows states contain the conditional Windows template.
          # Debian states contain only the default Debian lookup.
          # Doing this automatically avoids accidentally using the
          # Debian 20 GB disk definition for a 90 GB Windows VM.
          # ----------------------------------------------------

          if terraform state list | grep -Fxq 'data.vsphere_virtual_machine.windows_template[0]'; then
            export TF_VAR_vm_os='Windows Server 2022'
          elif terraform state list | grep -Fxq 'data.vsphere_virtual_machine.template'; then
            export TF_VAR_vm_os='Debian 13'
          else
            echo "ERROR: Unable to establish Windows/Debian template from state."
            echo "Destroy cancelled."
            exit 1
          fi
          echo "Operating system selected from state: $TF_VAR_vm_os"

          # ----------------------------------------------------
          # Create a destroy-only plan; do not apply anything here.
          # ----------------------------------------------------
          echo "Creating Terraform destroy plan..."
          terraform plan \
            -destroy \
            -input=false \
            -out=destroy.tfplan

          # ----------------------------------------------------
          # SAFETY CHECK 3: The *only* managed resource action
          # must be deletion of the VM verified above.
          # Do not print the plan JSON: it can contain secrets.
          # ----------------------------------------------------
          python3 - "$VM_RESOURCE" <<'PY_CHECK_PLAN'
          import json
          import subprocess
          import sys

          target = sys.argv[1]
          plan = json.loads(subprocess.check_output(
              ['terraform', 'show', '-json', 'destroy.tfplan']
          ))
          actions = [
              (r['address'], r['change']['actions'])
              for r in plan.get('resource_changes', [])
              if r.get('mode') == 'managed'
              and r['change']['actions'] != ['no-op']
          ]
          if actions != [(target, ['delete'])]:
              print('ERROR: Destroy plan does not contain exactly one expected VM deletion.')
              print('Managed actions:', [(a, acts) for a, acts in actions])
              sys.exit(1)
          print('Safety check passed: exactly one VM deletion planned:', target)
          PY_CHECK_PLAN

          # ----------------------------------------------------
          # Encrypt the saved plan before publishing it as an
          # artifact, as we do in the provisioning pipeline.
          # ----------------------------------------------------
          : "${TF_PLAN_PASSPHRASE:?Missing Terraform plan encryption passphrase}"
          printf '%s' "$TF_PLAN_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --symmetric --cipher-algo AES256 \
              --output destroy.tfplan.gpg destroy.tfplan
          rm -f destroy.tfplan
          echo "Encrypted destroy plan created successfully."

      env:

        # vSphere credentials from Azure DevOps variable group
        TF_VAR_vsphere_user: $(VSPHERE_USER)
        TF_VAR_vsphere_password: $(VSPHERE_PASSWORD)
        TF_VAR_vsphere_server: $(VSPHERE_SERVER)
        TF_VAR_windows_admin_password: $(WINDOWS_ADMIN_PASSWORD)
        TF_PLAN_PASSPHRASE: $(TF_PLAN_PASSPHRASE)

        # VM requested by Jira
        TF_VAR_vm_name: ${{ parameters.vm_name }}

        # Required by variables.tf even though this is a destroy
        TF_VAR_vm_hostname: 'decommission'
        TF_VAR_vm_cpu: '1'
        TF_VAR_vm_memory: '1024'
        TF_VAR_vm_network: 'NESTED-MGMT'

        # Jira request
        JIRA_ISSUE_KEY: ${{ parameters.jira_issue_key }}


    # ---------------------------------------------------------
    # Publish only the encrypted plan.
    #
    # Stage 2 decrypts and applies the SAME plan after approval.
    # ---------------------------------------------------------

    - publish: $(terraformDirectory)/destroy.tfplan.gpg
      artifact: terraform-destroy-plan
      displayName: 'Save Encrypted Terraform Destroy Plan'


# ============================================================
# STAGE 2 - APPROVAL + TERRAFORM DESTROY
# ============================================================

- stage: Destroy
  displayName: 'Terraform Destroy'

  dependsOn:
  - DestroyPlan

  condition: succeeded()

  jobs:

  - deployment: TerraformDestroy
    displayName: 'Decommission VMware VM'

    # ---------------------------------------------------------
    # Existing Azure DevOps Environment
    #
    # Approval configured on VMware-Production.
    # Pipeline pauses here before destruction.
    # ---------------------------------------------------------

    environment: 'VMware-Production'

    strategy:

      runOnce:

        deploy:

          steps:

          - checkout: self


          # ----------------------------------------------------
          # Download the EXACT destroy plan produced in Stage 1
          # ----------------------------------------------------

          - download: current
            artifact: terraform-destroy-plan
            displayName: 'Download Approved Destroy Plan'


          # ----------------------------------------------------
          # Terraform Destroy
          # ----------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Destroy VMware VM'

            inputs:

              azureSubscription: 'Azure-Terraform-State'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true

              inlineScript: |

                set -euo pipefail

                # Protect decrypted plan and clean up when task exits.
                umask 077
                trap 'rm -f destroy.tfplan' EXIT

                # ----------------------------------------------
                # Azure authentication for Terraform state
                # ----------------------------------------------

                export ARM_USE_AZUREAD=true
                export ARM_USE_OIDC=true
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_OIDC_TOKEN="$idToken"

                cd "$(terraformDirectory)"

                echo "===================================="
                echo "VM DECOMMISSION"
                echo "===================================="
                echo "Jira Issue: $JIRA_ISSUE_KEY"
                echo "VM Name:    $TF_VAR_vm_name"
                echo "===================================="

                # ----------------------------------------------
                # Reconnect to EXACTLY the same VM state
                # ----------------------------------------------

                terraform init \
                  -reconfigure \
                  -backend-config="key=jira-vms/${TF_VAR_vm_name}.tfstate"

                echo ""
                echo "Decrypting the approved destroy plan..."

                : "${TF_PLAN_PASSPHRASE:?Missing Terraform plan encryption passphrase}"
                printf '%s' "$TF_PLAN_PASSPHRASE" | \
                  gpg --batch --yes --pinentry-mode loopback \
                    --passphrase-fd 0 --decrypt \
                    --output destroy.tfplan \
                    "$(Pipeline.Workspace)/terraform-destroy-plan/destroy.tfplan.gpg"
                chmod 600 destroy.tfplan

                # Apply ONLY the exact destroy plan approved above.
                # No second planning step or separate destroy command.
                echo "Applying approved destroy plan..."
                terraform apply -input=false destroy.tfplan

                echo ""
                echo "===================================="
                echo "VM DECOMMISSIONED"
                echo "===================================="
                echo "VM Name: $TF_VAR_vm_name"
                echo "===================================="

            env:

              # vSphere credentials
              TF_VAR_vsphere_user: $(VSPHERE_USER)
              TF_VAR_vsphere_password: $(VSPHERE_PASSWORD)
              TF_VAR_vsphere_server: $(VSPHERE_SERVER)
              TF_VAR_windows_admin_password: $(WINDOWS_ADMIN_PASSWORD)
              TF_PLAN_PASSPHRASE: $(TF_PLAN_PASSPHRASE)

              # Requested VM
              TF_VAR_vm_name: ${{ parameters.vm_name }}

              # Required Terraform variables
              TF_VAR_vm_hostname: 'decommission'
              TF_VAR_vm_cpu: '1'
              TF_VAR_vm_memory: '1024'
              TF_VAR_vm_network: 'NESTED-MGMT'

              # Jira request
              JIRA_ISSUE_KEY: ${{ parameters.jira_issue_key }}


          # ====================================================
          # UPDATE JIRA AFTER SUCCESSFUL DECOMMISSION
          # ====================================================

          - task: Bash@3
            displayName: 'Update Jira - VM Decommissioned'

            condition: succeeded()

            inputs:

              targetType: 'inline'

              script: |

                set -e

                echo "Updating Jira issue: $JIRA_ISSUE_KEY"

                JIRA_COMMENT=$(cat <<EOF
                {
                  "body": {
                    "type": "doc",
                    "version": 1,
                    "content": [
                      {
                        "type": "paragraph",
                        "content": [
                          {
                            "type": "text",
                            "text": "VM decommission completed successfully."
                          }
                        ]
                      },
                      {
                        "type": "paragraph",
                        "content": [
                          {
                            "type": "text",
                            "text": "VM Name: $VM_NAME"
                          }
                        ]
                      },
                      {
                        "type": "paragraph",
                        "content": [
                          {
                            "type": "text",
                            "text": "The virtual machine was removed automatically by Azure DevOps / Terraform."
                          }
                        ]
                      }
                    ]
                  }
                }
                EOF
                )

                curl --fail-with-body \
                  --request POST \
                  --url "$JIRA_BASE_URL/rest/api/3/issue/$JIRA_ISSUE_KEY/comment" \
                  --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
                  --header "Accept: application/json" \
                  --header "Content-Type: application/json" \
                  --data "$JIRA_COMMENT"

                echo ""
                echo "Jira updated successfully."

            env:

              JIRA_BASE_URL: $(JIRA_BASE_URL)
              JIRA_EMAIL: $(JIRA_EMAIL)
              JIRA_API_TOKEN: $(JIRA_API_TOKEN)

              JIRA_ISSUE_KEY: ${{ parameters.jira_issue_key }}
              VM_NAME: ${{ parameters.vm_name }}
