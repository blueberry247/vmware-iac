# Jira -> Azure DevOps -> Terraform -> VMware
# Decommissioning: validate a single VM deletion, encrypt the plan, require
# VMware-Production approval, apply the exact plan, then comment in Jira.
trigger: none
pr: none

parameters:
- name: jira_issue_key
  displayName: Jira Issue Key
  type: string
  default: ''
- name: vm_name
  displayName: VM Name to Decommission
  type: string
  default: ''

pool:
  name: VMware-Lab

variables:
- group: VMware-Terraform-Secrets
- name: terraformDirectory
  value: '$(System.DefaultWorkingDirectory)/jira-vm'

stages:
- stage: DestroyPlan
  displayName: Terraform Destroy Plan
  condition: |
    and(succeeded(), ne('${{ parameters.vm_name }}', ''), ne('${{ parameters.jira_issue_key }}', ''))
  jobs:
  - template: pipelines/terraform-destroy-plan.yml
    parameters:
      jira_issue_key: ${{ parameters.jira_issue_key }}
      vm_name: ${{ parameters.vm_name }}

- stage: Destroy
  displayName: Approve and Decommission VMware VM
  dependsOn: DestroyPlan
  condition: succeeded()
  jobs:
  - template: pipelines/terraform-destroy-apply.yml
    parameters:
      jira_issue_key: ${{ parameters.jira_issue_key }}
      vm_name: ${{ parameters.vm_name }}
