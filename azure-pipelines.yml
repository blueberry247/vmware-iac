# ============================================================
# VMware VM Provisioning Pipeline
#
# Jira -> Azure DevOps -> Terraform -> VMware
# ============================================================

# ------------------------------------------------------------
# Values supplied by Jira
# ------------------------------------------------------------

parameters:

- name: jira_issue_key
  displayName: 'Jira Issue Key'
  type: string
  default: ''

- name: vm_name
  displayName: 'VM Name'
  type: string
  default: ''

- name: vm_hostname
  displayName: 'VM Hostname'
  type: string
  default: ''

- name: vm_cpu
  displayName: 'CPU'
  type: number
  default: 2

- name: vm_memory
  displayName: 'Memory (MB)'
  type: number
  default: 2048

- name: vm_environment
  displayName: 'Environment'
  type: string
  default: 'Development'

- name: vm_os
  displayName: 'Operating System'
  type: string
  default: 'Debian 13'

- name: vm_network
  displayName: 'VM Network'
  type: string
  default: 'NESTED-MGMT'


# ------------------------------------------------------------
# Pipeline settings
# ------------------------------------------------------------

trigger:
- main

pool:
  name: VMware-Lab

variables:
- group: VMware-Terraform-Secrets

- name: terraformDirectory
  value: '$(System.DefaultWorkingDirectory)/jira-vm'


# ============================================================
# STAGE 1 - TERRAFORM PLAN
# ============================================================

stages:

- stage: Plan
  displayName: 'Terraform Plan'

  # Do not provision anything when a normal Git commit
  # triggers the pipeline without a VM request.
  condition: |
    and(
      succeeded(),
      ne('${{ parameters.vm_name }}', '')
    )

  jobs:

  - job: TerraformPlan
    displayName: 'Plan VM'

    steps:

    - checkout: self

    - task: AzureCLI@2
      name: terraformPlan
      displayName: 'Terraform Init, Validate and Plan'

      inputs:
        azureSubscription: 'Azure-Terraform-State'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true

        inlineScript: |

          set -e

          # Azure authentication for Terraform state
          export ARM_USE_AZUREAD=true
          export ARM_USE_OIDC=true
          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_TENANT_ID="$tenantId"
          export ARM_OIDC_TOKEN="$idToken"

          cd "$(terraformDirectory)"

          echo "===================================="
          echo "VM Request"
          echo "===================================="
          echo "Jira:     $JIRA_ISSUE_KEY"
          echo "Name:     $TF_VAR_vm_name"
          echo "Hostname: $TF_VAR_vm_hostname"
          echo "CPU:      $TF_VAR_vm_cpu"
          echo "Memory:   $TF_VAR_vm_memory"
          echo "Network:  $TF_VAR_vm_network"
          echo "===================================="

          # Each Jira VM gets its own Terraform state.
          terraform init \
            -reconfigure \
            -backend-config="key=jira-vms/${TF_VAR_vm_name}.tfstate"

          terraform validate

          # Exit codes:
          # 0 = no changes
          # 1 = error
          # 2 = changes found

          set +e

          terraform plan \
            -input=false \
            -detailed-exitcode \
            -out=tfplan

          PLAN_EXIT_CODE=$?

          set -e

          if [ "$PLAN_EXIT_CODE" -eq 0 ]; then

            echo "No Terraform changes detected."

            echo "##vso[task.setvariable variable=changesDetected;isOutput=true]false"

          elif [ "$PLAN_EXIT_CODE" -eq 2 ]; then

            echo "Terraform changes detected."

            echo "##vso[task.setvariable variable=changesDetected;isOutput=true]true"

          else

            echo "Terraform plan failed."

            exit "$PLAN_EXIT_CODE"

          fi

      env:
        TF_VAR_vsphere_user: $(VSPHERE_USER)
        TF_VAR_vsphere_password: $(VSPHERE_PASSWORD)
        TF_VAR_vsphere_server: $(VSPHERE_SERVER)

        TF_VAR_vm_name: ${{ parameters.vm_name }}
        TF_VAR_vm_hostname: ${{ parameters.vm_hostname }}
        TF_VAR_vm_cpu: ${{ parameters.vm_cpu }}
        TF_VAR_vm_memory: ${{ parameters.vm_memory }}
        TF_VAR_vm_network: ${{ parameters.vm_network }}

        JIRA_ISSUE_KEY: ${{ parameters.jira_issue_key }}

    # Save the exact Terraform plan that was reviewed.
    - publish: $(terraformDirectory)/tfplan
      artifact: terraform-plan
      displayName: 'Save Terraform Plan'


# ============================================================
# STAGE 2 - APPROVAL + TERRAFORM APPLY
# ============================================================

- stage: Apply
  displayName: 'Terraform Apply'

  dependsOn:
  - Plan

  # Apply only when Terraform found changes.
  condition: |
    and(
      succeeded(),
      ne('${{ parameters.vm_name }}', ''),
      eq(
        dependencies.Plan.outputs['TerraformPlan.terraformPlan.changesDetected'],
        'true'
      )
    )

  jobs:

  - deployment: TerraformApply
    displayName: 'Create VMware VM'

    # Approval is configured on this Azure DevOps environment.
    environment: 'VMware-Production'

    strategy:

      runOnce:

        deploy:

          steps:

          - checkout: self

          - download: current
            artifact: terraform-plan
            displayName: 'Download Terraform Plan'

          - task: AzureCLI@2
            displayName: 'Terraform Apply'

            inputs:
              azureSubscription: 'Azure-Terraform-State'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true

              inlineScript: |

                set -e

                # Azure authentication for Terraform state
                export ARM_USE_AZUREAD=true
                export ARM_USE_OIDC=true
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_OIDC_TOKEN="$idToken"

                cd "$(terraformDirectory)"

                # Connect to the same state used during Plan.
                terraform init \
                  -reconfigure \
                  -backend-config="key=jira-vms/${TF_VAR_vm_name}.tfstate"

                # Apply the exact plan that was approved.
                terraform apply \
                  -input=false \
                  "$(Pipeline.Workspace)/terraform-plan/tfplan"

                echo ""
                echo "===================================="
                echo "VM CREATED"
                echo "===================================="

                terraform output

            env:
              TF_VAR_vsphere_user: $(VSPHERE_USER)
              TF_VAR_vsphere_password: $(VSPHERE_PASSWORD)
              TF_VAR_vsphere_server: $(VSPHERE_SERVER)

              TF_VAR_vm_name: ${{ parameters.vm_name }}
              TF_VAR_vm_hostname: ${{ parameters.vm_hostname }}
              TF_VAR_vm_cpu: ${{ parameters.vm_cpu }}
              TF_VAR_vm_memory: ${{ parameters.vm_memory }}
              TF_VAR_vm_network: ${{ parameters.vm_network }}

          # ----------------------------------------------------
          # Write successful provisioning details back to Jira
          # ----------------------------------------------------

          - task: Bash@3
            displayName: 'Update Jira with VM details'

            condition: succeeded()

            inputs:
              targetType: 'inline'

              script: |
                set -e

                cd "$(terraformDirectory)"

                VM_NAME=$(terraform output -raw vm_name)
                VM_IP=$(terraform output -raw vm_ip_address)

                echo "Updating Jira issue: $JIRA_ISSUE_KEY"
                echo "VM Name: $VM_NAME"
                echo "VM IP: $VM_IP"

                JIRA_COMMENT=$(cat <<EOF
                {
                  "body": {
                    "type": "doc",
                    "version": 1,
                    "content": [
                      {
                        "type": "paragraph",
                        "content": [
                          {
                            "type": "text",
                            "text": "VM provisioning completed successfully."
                          }
                        ]
                      },
                      {
                        "type": "paragraph",
                        "content": [
                          {
                            "type": "text",
                            "text": "VM Name: $VM_NAME"
                          }
                        ]
                      },
                      {
                        "type": "paragraph",
                        "content": [
                          {
                            "type": "text",
                            "text": "Hostname: $VM_HOSTNAME"
                          }
                        ]
                      },
                      {
                        "type": "paragraph",
                        "content": [
                          {
                            "type": "text",
                            "text": "IP Address: $VM_IP"
                          }
                        ]
                      },
                      {
                        "type": "paragraph",
                        "content": [
                          {
                            "type": "text",
                            "text": "Provisioned automatically by Azure DevOps / Terraform."
                          }
                        ]
                      }
                    ]
                  }
                }
                EOF
                )

                curl --fail-with-body \
                  --request POST \
                  --url "$JIRA_BASE_URL/rest/api/3/issue/$JIRA_ISSUE_KEY/comment" \
                  --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
                  --header "Accept: application/json" \
                  --header "Content-Type: application/json" \
                  --data "$JIRA_COMMENT"

                echo ""
                echo "Jira issue $JIRA_ISSUE_KEY updated successfully."

            env:
              JIRA_BASE_URL: $(JIRA_BASE_URL)
              JIRA_EMAIL: $(JIRA_EMAIL)
              JIRA_API_TOKEN: $(JIRA_API_TOKEN)

              JIRA_ISSUE_KEY: ${{ parameters.jira_issue_key }}
              VM_HOSTNAME: ${{ parameters.vm_hostname }}


# ============================================================
# STAGE 3 - TEMPORARY JIRA CONNECTION TEST
#
# Remove this stage after the Jira API test succeeds.
# It only runs when jira_issue_key = IT-6.
# ============================================================

- stage: TestJira
  displayName: 'Test Jira Connection'

  condition: |
  and(
    always(),
    eq('${{ parameters.jira_issue_key }}', 'IT-6')
  )

  jobs:

  - job: TestJiraComment
    displayName: 'Post Test Comment'

    steps:

    - task: Bash@3
      displayName: 'Send test comment to Jira'

      inputs:
        targetType: 'inline'

        script: |
          set -e

          echo "Testing Azure DevOps to Jira connection..."

          curl --fail-with-body \
            --request POST \
            --url "$JIRA_BASE_URL/rest/api/3/issue/IT-6/comment" \
            --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data '{
              "body": {
                "type": "doc",
                "version": 1,
                "content": [
                  {
                    "type": "paragraph",
                    "content": [
                      {
                        "type": "text",
                        "text": "Azure DevOps to Jira connection test successful."
                      }
                    ]
                  }
                ]
              }
            }'

          echo ""
          echo "Jira connection test completed successfully."

      env:
        JIRA_BASE_URL: $(JIRA_BASE_URL)
        JIRA_EMAIL: $(JIRA_EMAIL)
        JIRA_API_TOKEN: $(JIRA_API_TOKEN)
                



              
              
