# Jira -> Azure DevOps -> Terraform -> VMware -> Ansible -> Jira
# Provisioning entry point. Implementation lives in pipelines/ and scripts/.
parameters:
- name: jira_issue_key
  displayName: 'Jira Issue Key'
  type: string
  default: ''
- name: vm_name
  displayName: 'VM Name'
  type: string
  default: ''
- name: vm_hostname
  displayName: 'VM Hostname'
  type: string
  default: ''
- name: vm_cpu
  displayName: 'CPU'
  type: number
  default: 2
- name: vm_memory
  displayName: 'Memory (MB)'
  type: number
  default: 2048
- name: vm_environment
  displayName: 'Environment'
  type: string
  default: 'Development'
- name: vm_os
  displayName: 'Operating System'
  type: string
  default: 'Debian 13'
- name: vm_network
  displayName: 'VM Network'
  type: string
  default: 'NESTED-MGMT'

trigger: none
pool:
  name: VMware-Lab
variables:
- group: VMware-Terraform-Secrets
- name: terraformDirectory
  value: '$(System.DefaultWorkingDirectory)/jira-vm'

stages:
- template: pipelines/provision-stages.yml
  parameters:
    request:
      jira_issue_key: ${{ parameters.jira_issue_key }}
      vm_name: ${{ parameters.vm_name }}
      vm_hostname: ${{ parameters.vm_hostname }}
      vm_cpu: ${{ parameters.vm_cpu }}
      vm_memory: ${{ parameters.vm_memory }}
      vm_environment: ${{ parameters.vm_environment }}
      vm_os: ${{ parameters.vm_os }}
      vm_network: ${{ parameters.vm_network }}
