trigger:
- main

pool:
  name: VMware-Lab

variables:
- group: VMware-Terraform-Secrets

steps:
- checkout: self

- task: AzureCLI@2
  displayName: 'Terraform Init, Validate and Plan'
  inputs:
    azureSubscription: 'Azure-Terraform-State'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    addSpnToEnvironment: true
    inlineScript: |
      set -e

      # Pass Azure DevOps Workload Identity Federation credentials to Terraform
      export ARM_USE_AZUREAD=true
      export ARM_USE_OIDC=true
      export ARM_CLIENT_ID="$servicePrincipalId"
      export ARM_TENANT_ID="$tenantId"
      export ARM_OIDC_TOKEN="$idToken"

      echo "=== Agent ==="
      hostname
      whoami

      echo "=== Terraform ==="
      terraform version

      echo "=== Terraform Init ==="
      terraform init

      echo "=== Terraform Validate ==="
      terraform validate

      echo "=== Terraform Plan ==="
      terraform plan -input=false
  env:
    TF_VAR_vsphere_user: $(VSPHERE_USER)
    TF_VAR_vsphere_password: $(VSPHERE_PASSWORD)
    TF_VAR_vsphere_server: $(VSPHERE_SERVER)