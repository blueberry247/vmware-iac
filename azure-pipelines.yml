# ============================================================
# VMware VM Provisioning Pipeline
#
# Jira -> Azure DevOps -> Terraform -> VMware
# ============================================================

# ------------------------------------------------------------
# Values supplied by Jira
# ------------------------------------------------------------

parameters:

- name: jira_issue_key
  displayName: 'Jira Issue Key'
  type: string
  default: ''

- name: vm_name
  displayName: 'VM Name'
  type: string
  default: ''

- name: vm_hostname
  displayName: 'VM Hostname'
  type: string
  default: ''

- name: vm_cpu
  displayName: 'CPU'
  type: number
  default: 2

- name: vm_memory
  displayName: 'Memory (MB)'
  type: number
  default: 2048

- name: vm_environment
  displayName: 'Environment'
  type: string
  default: 'Development'

- name: vm_os
  displayName: 'Operating System'
  type: string
  default: 'Debian 13'

- name: vm_network
  displayName: 'VM Network'
  type: string
  default: 'NESTED-MGMT'


# -----------------------------------------------------------
# Pipeline settings
# -----------------------------------------------------------

# VM provisioning is triggered by Jira or manually
trigger: none

pool:
  name: VMware-Lab

variables:
- group: VMware-Terraform-Secrets

- name: terraformDirectory
  value: '$(System.DefaultWorkingDirectory)/jira-vm'


# ============================================================
# STAGE 1 - TERRAFORM PLAN
# ============================================================

stages:

- stage: Plan
  displayName: 'Terraform Plan'

  # Do not provision anything when a normal Git commit
  # triggers the pipeline without a VM request.
  condition: |
    and(
      succeeded(),
      ne('${{ parameters.vm_name }}', '')
    )

  jobs:

  - job: TerraformPlan
    displayName: 'Plan VM'

    steps:

    - checkout: self

    - task: AzureCLI@2
      name: terraformPlan
      displayName: 'Terraform Init, Validate and Plan'

      inputs:
        azureSubscription: 'Azure-Terraform-State'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true

        inlineScript: |

          set -e

          # Azure authentication for Terraform state
          export ARM_USE_AZUREAD=true
          export ARM_USE_OIDC=true
          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_TENANT_ID="$tenantId"
          export ARM_OIDC_TOKEN="$idToken"

          cd "$(terraformDirectory)"


          # Protect temporary Terraform plan files
          umask 077

          # Remove any old plan files
          rm -f tfplan tfplan.gpg

          # Always remove the unencrypted plan when the task exits
          trap 'rm -f tfplan' EXIT

          echo "===================================="
          echo "VM Request"
          echo "===================================="
          echo "Jira:     $JIRA_ISSUE_KEY"
          echo "Name:     $TF_VAR_vm_name"
          echo "Hostname: $TF_VAR_vm_hostname"
          echo "CPU:      $TF_VAR_vm_cpu"
          echo "Memory:   $TF_VAR_vm_memory"
          echo "Network:  $TF_VAR_vm_network"
          echo "===================================="

          # Each Jira VM gets its own Terraform state.
          terraform init \
            -reconfigure \
            -backend-config="key=jira-vms/${TF_VAR_vm_name}.tfstate"

          terraform validate

          # Exit codes:
          # 0 = no changes
          # 1 = error
          # 2 = changes found

          set +e

          terraform plan \
            -input=false \
            -detailed-exitcode \
            -out=tfplan

          PLAN_EXIT_CODE=$?

          set -e

          if [ "$PLAN_EXIT_CODE" -eq 0 ]; then

            echo "No Terraform changes detected."

            echo "##vso[task.setvariable variable=changesDetected;isOutput=true]false"

          elif [ "$PLAN_EXIT_CODE" -eq 2 ]; then

            echo "Terraform changes detected."

            echo "##vso[task.setvariable variable=changesDetected;isOutput=true]true"

          else

            echo "Terraform plan failed."

            exit "$PLAN_EXIT_CODE"

          fi

          # ============================================
          # Encrypt Terraform plan before publishing
          # ============================================

          if [ "$PLAN_EXIT_CODE" -eq 2 ]; then

            echo "Encrypting Terraform plan..."

            # Ensure an encryption passphrase is available
            : "${TF_PLAN_PASSPHRASE:?Missing Terraform plan encryption passphrase}"

            # Remove plaintext plan when this script exits
            trap 'rm -f tfplan' EXIT

            # Encrypt using AES-256
            printf '%s' "$TF_PLAN_PASSPHRASE" | \
              gpg --batch --yes \
              --pinentry-mode loopback \
              --passphrase-fd 0 \
              --symmetric \
              --cipher-algo AES256 \
              --output tfplan.gpg \
              tfplan

            # Delete the unencrypted plan
            rm -f tfplan

            echo "Terraform plan encrypted successfully."

          fi

      env:
        TF_VAR_vsphere_user: $(VSPHERE_USER)
        TF_VAR_vsphere_password: $(VSPHERE_PASSWORD)
        TF_VAR_vsphere_server: $(VSPHERE_SERVER)
        TF_PLAN_PASSPHRASE: $(TF_PLAN_PASSPHRASE)
        TF_VAR_vm_os: ${{ parameters.vm_os }}
        TF_VAR_windows_admin_password: $(WINDOWS_ADMIN_PASSWORD)
        TF_VAR_ansible_ssh_public_key: $(ANSIBLE_SSH_PUBLIC_KEY)

        TF_VAR_vm_name: ${{ parameters.vm_name }}
        TF_VAR_vm_hostname: ${{ parameters.vm_hostname }}
        TF_VAR_vm_cpu: ${{ parameters.vm_cpu }}
        TF_VAR_vm_memory: ${{ parameters.vm_memory }}
        TF_VAR_vm_network: ${{ parameters.vm_network }}

        JIRA_ISSUE_KEY: ${{ parameters.jira_issue_key }}

    # Publish only the encrypted Terraform plan
    - publish: $(terraformDirectory)/tfplan.gpg
      artifact: terraform-plan
      displayName: 'Save Encrypted Terraform Plan'
      condition: and(succeeded(), eq(variables['terraformPlan.changesDetected'], 'true'))


# ============================================================
# STAGE 2 - APPROVAL + TERRAFORM APPLY
# ============================================================

- stage: Apply
  displayName: 'Terraform Apply'

  dependsOn:
  - Plan

  # Apply only when Terraform found changes.
  condition: |
    and(
      succeeded(),
      ne('${{ parameters.vm_name }}', ''),
      eq(
        dependencies.Plan.outputs['TerraformPlan.terraformPlan.changesDetected'],
        'true'
      )
    )

  jobs:

  - deployment: TerraformApply
    displayName: 'Create VMware VM'

    # Approval is configured on this Azure DevOps environment.
    environment: 'VMware-Production'

    strategy:

      runOnce:

        deploy:

          steps:

          - checkout: self

          - download: current
            artifact: terraform-plan
            displayName: 'Download Terraform Plan'

          - task: AzureCLI@2
            displayName: 'Terraform Apply'

            inputs:
              azureSubscription: 'Azure-Terraform-State'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true

              inlineScript: |

                set -e

                # Azure authentication for Terraform state
                export ARM_USE_AZUREAD=true
                export ARM_USE_OIDC=true
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_OIDC_TOKEN="$idToken"

                cd "$(terraformDirectory)"

                # Protect decrypted Terraform plan
                umask 077

                # Remove any leftover plaintext plan
                rm -f tfplan

                # Connect to the same state used during Plan.
                terraform init \
                  -reconfigure \
                  -backend-config="key=jira-vms/${TF_VAR_vm_name}.tfstate"


                # ============================================
                # Decrypt the approved Terraform plan
                # ============================================

                echo "Decrypting approved Terraform plan..."

                : "${TF_PLAN_PASSPHRASE:?Missing Terraform plan encryption passphrase}"


                # Remove decrypted plan when the task exits
                trap 'rm -f tfplan' EXIT

                printf '%s' "$TF_PLAN_PASSPHRASE" | \
                 gpg --batch --yes \
                 --pinentry-mode loopback \
                 --passphrase-fd 0 \
                 --decrypt \
                 --output tfplan \
                 "$(Pipeline.Workspace)/terraform-plan/tfplan.gpg"

                 chmod 600 tfplan

                 echo "Terraform plan decrypted successfully."


                # Apply the decrypted Terraform plan
                terraform apply \
                  -input=false \
                  tfplan


                echo ""
                echo "===================================="
                echo "VM CREATED"
                echo "===================================="

                terraform output

                VM_IP=$(terraform output -raw vm_ip_address)

                # Validate the IP address returned by VMware
                if [ -z "${VM_IP//[[:space:]]/}" ] || [ "$VM_IP" = "0.0.0.0" ] || [ "$VM_IP" = "<nil>" ]; then
                  echo "ERROR: VMware did not return a usable VM IP address."
                  exit 1
                fi

                echo "VM IP Address: $VM_IP"

                echo "##vso[task.setvariable variable=PROVISIONED_VM_IP]$VM_IP"

            env:
              TF_VAR_vsphere_user: $(VSPHERE_USER)
              TF_VAR_vsphere_password: $(VSPHERE_PASSWORD)
              TF_VAR_vsphere_server: $(VSPHERE_SERVER)

              TF_VAR_vm_os: ${{ parameters.vm_os }}
              TF_VAR_windows_admin_password: $(WINDOWS_ADMIN_PASSWORD)
              TF_VAR_ansible_ssh_public_key: $(ANSIBLE_SSH_PUBLIC_KEY)
              TF_PLAN_PASSPHRASE: $(TF_PLAN_PASSPHRASE)
              TF_VAR_vm_name: ${{ parameters.vm_name }}
              TF_VAR_vm_hostname: ${{ parameters.vm_hostname }}
              TF_VAR_vm_cpu: ${{ parameters.vm_cpu }}
              TF_VAR_vm_memory: ${{ parameters.vm_memory }}
              TF_VAR_vm_network: ${{ parameters.vm_network }}


          # ====================================================
          # ANSIBLE - WINDOWS SERVER 2022 READINESS
          # ====================================================

          - task: Bash@3
            displayName: 'Ansible - Configure Windows Server 2022'

            condition: and(succeeded(), eq('${{ parameters.vm_os }}', 'Windows Server 2022'))

            inputs:
              targetType: 'inline'

              script: |
                set -euo pipefail

                echo "===================================="
                echo "ANSIBLE WINDOWS CONFIGURATION"
                echo "===================================="

                : "${VM_IP:?Missing VM IP address}"
                : "${WINDOWS_ADMIN_PASSWORD:?Missing Windows Administrator password}"

                echo "Target VM IP: $VM_IP"
                echo "Connecting to ANSIBLE-01..."

                # Send Ansible connection settings securely over SSH.
                # Password is not included in command-line arguments.

                python3 - <<'PY' | ssh \
                  -o BatchMode=yes \
                  -o StrictHostKeyChecking=yes \
                  bardfox@192.168.1.113 '
                    set -eu
                    umask 077

                    varsfile=$(mktemp)

                    trap "rm -f \"$varsfile\"" EXIT

                    cat > "$varsfile"

                    ansible-playbook \
                      -i "provisioned-windows," \
                      /home/bardfox/ansible-provisioning/windows-ready.yml \
                      -e "@$varsfile"
                  '
                import json
                import os

                print(json.dumps({
                    "ansible_host": os.environ["VM_IP"],
                    "ansible_connection": "winrm",
                    "ansible_user": "Administrator",
                    "ansible_port": 5985,
                    "ansible_winrm_transport": "ntlm",
                    "ansible_winrm_message_encryption": "always",
                    "ansible_password": os.environ["WINDOWS_ADMIN_PASSWORD"]
                }))
                PY

                echo "===================================="
                echo "ANSIBLE WINDOWS CHECK COMPLETED"
                echo "===================================="

            env:
              VM_IP: $(PROVISIONED_VM_IP)
              WINDOWS_ADMIN_PASSWORD: $(WINDOWS_ADMIN_PASSWORD)


          # ====================================================
          # ANSIBLE - DEBIAN 13 READINESS
          # ====================================================

          - task: Bash@3
            displayName: 'Ansible - Verify Debian 13 readiness'

            condition: and(succeeded(), eq('${{ parameters.vm_os }}', 'Debian 13'))

            inputs:
              targetType: 'inline'

              script: |
                set -euo pipefail

                echo "===================================="
                echo "ANSIBLE DEBIAN 13 READINESS"
                echo "===================================="

                : "${VM_IP:?Missing VM IP address}"

                echo "Target Debian VM: $VM_IP"

                python3 - <<'PY' | ssh \
                  -o BatchMode=yes \
                  -o StrictHostKeyChecking=yes \
                  bardfox@192.168.1.113 '
                    set -eu
                    umask 077

                    varsfile=$(mktemp)
                    trap "rm -f \"$varsfile\"" EXIT

                    cat > "$varsfile"

                    ansible-playbook \
                      -i "provisioned-debian," \
                      /home/bardfox/ansible-provisioning/debian-ready.yml \
                      -e "@$varsfile"
                  '
                import json
                import os

                print(json.dumps({
                    "ansible_host": os.environ["VM_IP"],
                    "ansible_user": "bardfox",
                    "ansible_connection": "ssh",
                    "ansible_ssh_private_key_file": "/home/bardfox/.ssh/id_ed25519",
                    "ansible_ssh_common_args": "-o StrictHostKeyChecking=yes -o BatchMode=yes"
                }))
                PY

                echo "Debian 13 Ansible readiness completed successfully."

            env:
              VM_IP: $(PROVISIONED_VM_IP)


          # ----------------------------------------------------
          # Write successful provisioning details back to Jira
          # ----------------------------------------------------

          - task: Bash@3
            displayName: 'Update Jira with VM details'

            condition: succeeded()

            inputs:
              targetType: 'inline'

              script: |
                set -e


                VM_NAME="$VM_NAME_PARAMETER"
                VM_IP="$PROVISIONED_VM_IP"

                echo "Updating Jira issue: $JIRA_ISSUE_KEY"
                echo "VM Name: $VM_NAME"
                echo "VM IP: $VM_IP"

                JIRA_COMMENT=$(cat <<EOF
                {
                  "body": {
                    "type": "doc",
                    "version": 1,
                    "content": [
                      {
                        "type": "paragraph",
                        "content": [
                          {
                            "type": "text",
                            "text": "VM provisioning completed successfully."
                          }
                        ]
                      },
                      {
                        "type": "paragraph",
                        "content": [
                          {
                            "type": "text",
                            "text": "VM Name: $VM_NAME"
                          }
                        ]
                      },
                      {
                        "type": "paragraph",
                        "content": [
                          {
                            "type": "text",
                            "text": "Hostname: $VM_HOSTNAME"
                          }
                        ]
                      },
                      {
                        "type": "paragraph",
                        "content": [
                          {
                            "type": "text",
                            "text": "IP Address: $VM_IP"
                          }
                        ]
                      },
                      {
                        "type": "paragraph",
                        "content": [
                          {
                            "type": "text",
                            "text": "Provisioned automatically by Azure DevOps / Terraform."
                          }
                        ]
                      }
                    ]
                  }
                }
                EOF
                )

                curl --fail-with-body \
                  --request POST \
                  --url "$JIRA_BASE_URL/rest/api/3/issue/$JIRA_ISSUE_KEY/comment" \
                  --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
                  --header "Accept: application/json" \
                  --header "Content-Type: application/json" \
                  --data "$JIRA_COMMENT"

                echo ""
                echo "Jira issue $JIRA_ISSUE_KEY updated successfully."

            env:
              JIRA_BASE_URL: $(JIRA_BASE_URL)
              JIRA_EMAIL: $(JIRA_EMAIL)
              JIRA_API_TOKEN: $(JIRA_API_TOKEN)
              JIRA_ISSUE_KEY: ${{ parameters.jira_issue_key }}
              VM_HOSTNAME: ${{ parameters.vm_hostname }}
              VM_NAME_PARAMETER: ${{ parameters.vm_name }}
              PROVISIONED_VM_IP: $(PROVISIONED_VM_IP)







